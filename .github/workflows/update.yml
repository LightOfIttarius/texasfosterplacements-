name: Weekly data refresh

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python update_scores.py
      - run: git config user.name "data-refresh-bot"
      - run: git config user.email "actions@users.noreply.github.com"
      - run: git add scored_placements.csv
      - run: git diff --staged --quiet || git commit -m "Weekly data refresh"
      - run: git push
